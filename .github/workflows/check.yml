# Lint and package build when the OS changes. The VM install test
# (vm/test-install) needs KVM and runs locally. The website has its own
# workflow (site.yml); changes only to it don't run this. The manual is part of the OS (installed
# on every system) and runs both.
name: check

on:
  push:
    paths:
      - "**"
      - "!site/**"
      - "!tools/make-site"
      - "!tools/deploy-site"
      - "!tools/preview-site"
      - "!tools/publish-iso"
      - "!tools/site-stats"
      - "!.github/workflows/site.yml"
      - "!docs/**"
      - "docs/manual/**"
  pull_request:
    paths:
      - "**"
      - "!site/**"
      - "!tools/make-site"
      - "!tools/deploy-site"
      - "!tools/preview-site"
      - "!tools/publish-iso"
      - "!tools/site-stats"
      - "!.github/workflows/site.yml"
      - "!docs/**"
      - "docs/manual/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck, lua and jq
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck lua5.4 jq
      - name: Lint
        run: tools/lint
      - name: Unit tests
        run: for t in tests/*; do "$t"; done

  packages:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git meson ninja scdoc wayland-protocols wayland cairo pam libxkbcommon glib2 gdk-pixbuf2 rust wlroots0.20 nlohmann-json stb tomlplusplus libinput librsvg libwebp pango libglvnd glslang pixman libdrm libxcb xcb-util-errors hyprland noctalia go python
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # pkg/build versions packages from the layer tags
      - name: Luau syntax and the menu's search timing (the shell's plugins)
        run: |
          pacman -S --noconfirm --needed luau
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for f in $(git ls-files '*.luau'); do luau-compile --null "$f" >/dev/null || exit 1; done
          tests/menu-search
      - name: Build packages
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder
          chown -R builder .
          su builder -c 'pkg/build'
      - name: Name epoch packages without ':' (artifact names can't hold it)
        run: |
          for f in pkg/out-test/repo/*:*; do
            [ -e "$f" ] && mv "$f" "$(echo "$f" | tr : .)"
          done
          true
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: pkg/out-test/repo/
