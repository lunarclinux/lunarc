# The only place the distro's name is written. Everything else reads it from here.
# Renaming the distro means changing these three lines (until packages exist, layer 6).
DISTRO_ID=tbd          # os-release ID, /usr/share/$DISTRO_ID, command prefix
DISTRO_NAME="TBD"      # PRETTY_NAME, docs, login screen
DISTRO_REPO=tbd        # [section] name in pacman.conf
