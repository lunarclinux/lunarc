# The only place the distro's name is written. Everything else reads it from here.
# Renaming the distro means changing these three lines (until packages are published, layer 7).
DISTRO_ID=lunarc           # os-release ID, /usr/share/$DISTRO_ID, command prefix, package names
DISTRO_NAME="Lunarc"       # shown on the login screen, installer, docs
DISTRO_REPO=lunarc         # [section] name in pacman.conf
