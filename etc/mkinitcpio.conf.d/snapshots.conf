# Bootable snapshots (decision record 0036): the boot menu's snapshot entries
# start a read-only snapshot under a RAM overlay (systemd.volatile=overlay).
# systemd's initramfs does that with systemd-volatile-root.service, which
# Arch's systemd hook doesn't include; add it, its program and the overlay
# filesystem. Appends, so other drop-ins' MODULES/FILES/BINARIES stay.
MODULES+=(overlay)
FILES+=(/usr/lib/systemd/system/systemd-volatile-root.service)
BINARIES+=(/usr/lib/systemd/systemd-volatile-root)
