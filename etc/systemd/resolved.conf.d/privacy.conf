# systemd-resolved never answers or asks on the local network by itself
# (decision record 0046): no LLMNR (UDP/TCP 5355) and no multicast DNS (UDP
# 5353). Avahi finds printers and resolves .local names (decision record 0045),
# browsing only. resolved runs only while encrypted DNS is on
# (`@DISTRO_ID@ privacy dns`).
[Resolve]
LLMNR=no
MulticastDNS=no
