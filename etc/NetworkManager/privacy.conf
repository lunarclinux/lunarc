# Network privacy defaults (decision record 0031). Per-connection settings in
# NetworkManager override these.
[device]
# Wi-Fi scans use a random MAC address.
wifi.scan-rand-mac-address=yes

[connection]
# On Wi-Fi, a random MAC address per network, kept the same for that network
# (so captive-portal logins and router reservations still work), so you can't
# be followed from network to network. Ethernet keeps the real address: random
# wired addresses break DHCP reservations and wake-on-LAN.
wifi.cloned-mac-address=stable
# Temporary IPv6 addresses for outgoing connections (RFC 4941).
ipv6.ip6-privacy=2
# Don't announce this computer's name to every network's DHCP server.
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
