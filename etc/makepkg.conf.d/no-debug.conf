# No separate -debug packages for what you build yourself (AUR apps
# through yay, or the app catalog). Arch's makepkg.conf turns `debug` on, so
# every AUR build also made a <name>-debug package of debug symbols that hardly
# anyone uses, kept on disk and rebuilt on every update.
#
# Turned off here, by flipping only that one option; the rest of OPTIONS stays
# as /etc/makepkg.conf (or your ~/.config/pacman/makepkg.conf) has it.
#
# Want debug packages again, say to get a readable backtrace from a crashing
# AUR app? Delete this line, or put `OPTIONS+=(debug)` in
# ~/.config/pacman/makepkg.conf, then rebuild the package
# (yay -S --rebuild <name>). A PKGBUILD can also ask for it with options=(debug).
OPTIONS=("${OPTIONS[@]/#debug/!debug}")
