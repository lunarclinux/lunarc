# Login screen: greetd running the tuigreet text greeter on the first console.
# Colour names refer to the console palette, which the kernel command line sets
# to the default theme's (yellow = moon gold, gray = moonlight, black = night).
[terminal]
vt = 1

[default_session]
command = "tuigreet --time --remember --remember-session --asterisks --greeting '@DISTRO_NAME@' --theme 'border=yellow;title=yellow;greet=yellow;prompt=yellow;button=yellow;text=gray;time=gray;input=gray;action=blue;container=black' --cmd 'uwsm start -e -D Hyprland hyprland.desktop'"
user = "greeter"
