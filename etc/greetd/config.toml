# Login screen: greetd runs the distro's login wrapper on the first console, as
# the unprivileged greeter user. It shows Noctalia Greeter in the current theme,
# or the tuigreet text greeter if Noctalia Greeter is missing or can't start.
[terminal]
vt = 1

[default_session]
command = "/usr/lib/@DISTRO_ID@/greeter"
user = "greeter"
