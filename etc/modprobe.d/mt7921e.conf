# MediaTek MT7921/MT7922 Wi-Fi (Lenovo Legion and IdeaPad, ASUS, many AMD
# laptops): with PCIe power saving (ASPM) on, the card times out on every
# resume from suspend ("pci_pm_resume returns -110") and comes back in a bad
# state. Applies only when the mt7921e driver loads; other cards are unaffected.
# Costs a little idle power on these cards. Tested on the Legion 2026-10-16 to
# 2026-10-25. To turn it off: `options mt7921e disable_aspm=0` in
# /etc/modprobe.d/mt7921e.conf (read after this file).
options mt7921e disable_aspm=1
