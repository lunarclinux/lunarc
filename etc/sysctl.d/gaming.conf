# Game compatibility (decision record 0053). Neither costs anything outside games.
# SteamOS's value: some games (and Proton) map more memory areas than Arch's default allows.
vm.max_map_count = 2147483642
# Don't throttle programs that do split locks (some Windows games do); the
# throttle is a fairness measure for shared servers.
kernel.split_lock_mitigate = 0
