# Memory settings for swap that is compressed RAM (zram, see
# /etc/systemd/zram-generator.conf) (decision record 0053).
# Swapping to zram is cheap, so swap idle pages early rather than drop file cache.
vm.swappiness = 150
# Reading ahead from swap only helps a disk; zram pages come back one at a time.
vm.page-cluster = 0
# No background memory compaction: it can stall the system for a moment (frame-time spikes).
vm.compaction_proactiveness = 0
