# Distro defaults for Noctalia. Included by ~/.config/noctalia/config.toml.
# Don't edit: updates replace this file. Override in your own config.

[shell]
font_family = "Inter"
polkit_agent = true          # Noctalia's own password prompt, themed like the rest
telemetry_enabled = false

# Lock after 10 minutes idle, screens off a minute later.
[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 660
action = "screen_off"
enabled = true

# Carry the theme's colours to other apps. Each template only touches apps
# whose config file exists (starter configs ship for every terminal listed).
[theme.templates]
enable_builtin_templates = true
builtin_ids = ["ghostty", "alacritty", "kitty", "foot", "wezterm", "gtk3", "gtk4", "qt", "hyprland", "btop"]

# Distro plugins ship read-only in /usr/share; Noctalia loads them from there.
[plugins]
enabled = ["@DISTRO_ID@/crashes"]

[[plugins.source]]
name = "@DISTRO_ID@"
kind = "path"
location = "/usr/share/@DISTRO_ID@/default/noctalia-plugins"
enabled = true

# The crash indicator sits before the notification bell (it hides itself when
# there are no open crashes). Otherwise Noctalia's default bar.
[widget.crashes]
type = "@DISTRO_ID@/crashes:indicator"

[bar.default]
start  = ["launcher", "wallpaper", "workspaces"]
center = ["clock"]
end    = ["media", "tray", "crashes", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session"]
