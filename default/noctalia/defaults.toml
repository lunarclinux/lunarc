# Distro defaults for Noctalia. Included by ~/.config/noctalia/config.toml.
# Don't edit: updates replace this file. Override in your own config.

[shell]
# Geist, the design's second face (decision record 0043): the bar and the
# distro's own popovers use Geist Mono, but Noctalia's panels are laid out
# for a proportional face and cut mono labels short.
font_family = "Geist"
polkit_agent = true          # Noctalia's own password prompt, themed like the rest
telemetry_enabled = false     # no usage ping to noctalia.dev
external_ip_enabled = false   # the network tab doesn't look up your public address (api.noctalia.dev/ip)
setup_wizard_enabled = false  # the distro applies its own theme and settings at first login
# Frosted Terminal (decision record 0043): a 1px amber line along the top
# inner edge of the bar, panels, launcher, OSD and toasts, and a faint sheen
# over them. Options of the distro's Noctalia build (pkg/noctalia); colours
# default to the theme's primary (32%) and text colour (7% to 2%).
top_highlight = true
surface_sheen = true
# Frosted Terminal popovers: Noctalia's panels (quick settings, the calendar,
# notifications, the session menu, the launcher) float under what opened them,
# at the design's popover fill (soft: 80%, the nearest to bg.popover's 76%).
# Their amber border and corners come from the theme and `@DISTRO_ID@ theme
# shape`: border_color (for panels an option of the distro's build) and
# corner_radius_scale, written to ~/.config/noctalia/00-@DISTRO_ID@-look.toml.
# Each app opened from the launcher runs as its own systemd unit, not inside
# the shell's, so restarting or updating the shell doesn't close the apps it
# opened.
launch_apps_as_systemd_services = true

# The launcher's calculator converts currencies with the rates it has; it
# doesn't download new ones (it would on every start, from libqalculate's
# sources). The manual's privacy page lists no exchange-rate downloads.
[shell.launcher]
fetch_exchange_rates = false

# Cover art from a media player is shown only from a local file; art the
# player names by web address (and YouTube thumbnails) isn't downloaded. An
# option of the distro's build (pkg/noctalia, no-background-fetch.patch).
[shell.mpris]
remote_art = false

[shell.panel]
transparency_mode = "soft"
control_center_placement = "floating"
open_near_click_control_center = true
session_placement = "floating"
open_near_click_session = true
wallpaper_placement = "floating"
open_near_click_wallpaper = true

# A section opened from the bar (the calendar from the clock, notifications
# from the bell, a tab from network or battery) shows on its own, without the
# tab list; quick settings (SUPER+S) keep it.
[control_center]
sidebar_section = "none"

# Noctalia's on-screen displays match the popovers. Volume and brightness are
# the distro's own pill (`@DISTRO_ID@ osd`), so Noctalia's are off; the
# others (Wi-Fi, Bluetooth, caps lock, …) show in the same place.
[osd]
position = "bottom_center"
background_opacity = 0.80

[osd.kinds]
volume = false
brightness = false

# Notification cards: the popover fill (and amber border, above). An icon
# given as a web address isn't downloaded (an option of the distro's build).
[notification]
background_opacity = 0.80
remote_icons = false

# After 5 minutes idle: lock, with the screensaver playing behind the lock
# (`@DISTRO_ID@ lock --idle`; type the password to come back). Screens off at
# 11 minutes. Noctalia's own lock step stays off; it is the fallback the lock
# command uses if its lock screen can't start.
[idle]
behavior_order = ["screensaver", "lock", "screen-off"]

[idle.behavior.screensaver]
timeout = 300
action = "command"
command = "@DISTRO_ID@ lock --idle"
enabled = true

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = false

# Locking before sleep is the distro's lock-watch service (`@DISTRO_ID@ lock`),
# so the screensaver plays behind the lock after waking too.
[lockscreen]
lock_before_suspend = false

[idle.behavior.screen-off]
timeout = 660
action = "screen_off"
enabled = true

# Carry the theme's colours to other apps. Each template only touches apps
# whose config file exists (starter configs ship for every terminal listed).
# Hyprland's colours come from the theme's design tokens instead (`@DISTRO_ID@
# theme`, default/hypr/look.lua).
[theme.templates]
enable_builtin_templates = true
# Community templates come from api.noctalia.dev; turning them on in Settings ›
# Templates fetches the catalog.
enable_community_templates = false
builtin_ids = ["ghostty", "alacritty", "kitty", "foot", "wezterm", "gtk3", "gtk4", "qt", "btop", "starship"]

# Distro plugins ship read-only in /usr/share; Noctalia loads them from there.
[plugins]
enabled = ["@DISTRO_ID@/crashes", "@DISTRO_ID@/agents", "@DISTRO_ID@/utilities"]
# No background checks of online plugin catalogs; install or update plugins
# from Settings when you want to.
auto_update = "none"

[[plugins.source]]
name = "@DISTRO_ID@"
kind = "path"
location = "/usr/share/@DISTRO_ID@/noctalia-plugins"
enabled = true

# The bar (Frosted Terminal, decision record 0043): flat segments between
# hairlines, Geist Mono. Left: the menu button, workspaces, the window title and
# what's playing. Centre: the clock, pinned to the exact middle (anchor), with
# the toggles that are on flush against its left (decision record 0042) and
# the opt-in moon and weather to its right. Right: stats, notifications,
# network, volume, battery, power. Its height, corners and inset follow
# `@DISTRO_ID@ theme shape`, and the lists follow the bar settings; both are
# written by `@DISTRO_ID@` into your config.toml (bar_apply). Values here are
# the terminal shape's.
[bar.default]
thickness = 30
margin_edge = 0
margin_ends = 0
radius = 0
concave_edge_corners = false
border = "#e6e2d621"          # border.hairline (Moonlit); bar_apply writes the theme's
border_width = 1
background_opacity = 0.52
padding = 0
widget_spacing = 0
font_family = "Geist Mono"
font_weight = 500
font_scale = 0.857            # 12px labels
color = "on_surface_variant"
# Built-in widgets sit in invisible capsules, which give them their padding;
# the distro's own segments draw their own.
capsule = true
capsule_fill = "#00000000"
capsule_padding = 8
capsule_thickness = 1.0
capsule_radius = 0
start  = ["menu", "workspaces", "window", "media"]
center = ["toggles", "stay-awake", "night-light", "gravity", "silence", "reminders", "recorder", "dictate", "clock"]  # + "moon", "weather" when turned on (bar_apply)
end    = ["tray", "ai-usage", "crashes", "stats", "notifications", "keyboard_layout", "network", "volume", "battery", "power-divider", "session"]

[widget.menu]
type = "@DISTRO_ID@/utilities:menu-button"
capsule = false

[widget.menu.actions]
left = "exec @DISTRO_ID@ menu"
right = "panel-toggle launcher"

# Workspaces: two-digit numbers, the one you're on tinted, with its moon phase
# (decision record 0037). Noctalia's own pills stay available:
# `@DISTRO_ID@ workspaces style noctalia`.
[widget.workspaces]
type = "@DISTRO_ID@/utilities:workspaces"
capsule = false

[widget.workspaces-noctalia]
type = "workspaces"
style = "regular"
show_labels = true
labels_only_when_occupied = false

[widget.window]
type = "active_window"
display = "text_only"
max_length = 420
min_length = 0
color = "on_surface"
capsule_padding = 12

[widget.media]
type = "@DISTRO_ID@/utilities:media"
capsule = false

# Left click: now playing (the plugin's popover, which the widget opens).
[widget.media.actions]
right = "media toggle"

# The toggles (decision record 0042): an anchor icon, then only the toggles
# that are on, in amber (recording in coral). Hovering the anchor shows them
# all. Stay awake and night light are the plugin's own widgets, so they can
# hide when off.
[widget.toggles]
type = "@DISTRO_ID@/utilities:toggles"
capsule = false

[widget.stay-awake]
type = "@DISTRO_ID@/utilities:stay-awake"
capsule = false

[widget.night-light]
type = "@DISTRO_ID@/utilities:nightlight"
capsule = false

[widget.gravity]
type = "@DISTRO_ID@/utilities:gravity"
capsule = false

[widget.silence]
type = "@DISTRO_ID@/utilities:silence"
capsule = false

[widget.reminders]
type = "@DISTRO_ID@/utilities:reminders"
capsule = false

[widget.recorder]
type = "@DISTRO_ID@/utilities:recorder"
capsule = false

[widget.dictate]
type = "@DISTRO_ID@/utilities:dictate"
capsule = false

[widget.clock]
type = "@DISTRO_ID@/utilities:clock"
anchor = true
capsule = false

[widget.clock.actions]
left = "panel-toggle control-center calendar"

[widget.moon]
type = "@DISTRO_ID@/utilities:moon"
capsule = false

# The weather as one of the bar's segments (`☁ 52°`, and `· ◐ 62%` when the
# moon is on too): the plugin's, reading Noctalia's weather reading. Noctalia's
# own widget is still there as type "weather". Click: the weather tab.
[widget.weather]
type = "@DISTRO_ID@/utilities:weather"
capsule = false

[widget.weather.actions]
left = "panel-toggle control-center weather"

# Was after Noctalia's weather widget; kept for bar blocks written before the
# weather segment, until `@DISTRO_ID@` rewrites them.
[widget.weather-divider]
type = "@DISTRO_ID@/utilities:divider"
capsule = false
interactive = false

[widget.stats]
type = "@DISTRO_ID@/utilities:stats"
capsule = false

[widget.tray]
drawer = true

# The bell: an amber dot when something is unread.
[widget.notifications]
hide_when_no_unread = false

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.brightness]
show_label = false

# The active keyboard layout, only when there is more than one; click to switch.
[widget.keyboard_layout]
hide_when_single_layout = true

[widget.battery]
show_label = false
hide_when_full = false

[widget.power-divider]
type = "@DISTRO_ID@/utilities:divider"
capsule = false
interactive = false

[widget.session]
capsule_padding = 12

# Low-battery warning at 20%; `@DISTRO_ID@ power` adds persistent alerts at 10%
# and 5% (settings power.battery_critical and power.battery_final).
[battery]
warning_threshold = 20

# Each hides itself when it has nothing to show.
[widget.crashes]
type = "@DISTRO_ID@/crashes:indicator"

[widget.ai-usage]
type = "@DISTRO_ID@/agents:usage"

# Quick settings (SUPER+S): Noctalia's default tiles, with the plugin's stay
# awake and night light in place of the built-in ones so they match the bar.
[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "@DISTRO_ID@/utilities:stay-awake-shortcut"

[[control_center.shortcuts]]
type = "@DISTRO_ID@/utilities:nightlight-shortcut"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

# Location and weather are off until you turn them on (they send your city to
# Noctalia's geocoder and Open-Meteo): first-login setup asks, or run
# `@DISTRO_ID@ privacy weather on`. Never locate by IP address.
[location]
auto_locate = false

[weather]
enabled = false
unit = "metric"
