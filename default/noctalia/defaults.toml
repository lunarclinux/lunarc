# Distro defaults for Noctalia. Included by ~/.config/noctalia/config.toml.
# Don't edit: updates replace this file. Override in your own config.

[shell]
font_family = "Inter"
polkit_agent = true          # Noctalia's own password prompt, themed like the rest
telemetry_enabled = false     # no usage ping to noctalia.dev
setup_wizard_enabled = false  # the distro applies its own theme and settings at first login

# After 5 minutes idle: lock, with the screensaver playing behind the lock
# (`@DISTRO_ID@ lock --idle`; type the password to come back). Screens off at
# 11 minutes. Noctalia's own lock step stays off; it is the fallback the lock
# command uses if its lock screen can't start.
[idle]
behavior_order = ["screensaver", "lock", "screen-off"]

[idle.behavior.screensaver]
timeout = 300
action = "command"
command = "@DISTRO_ID@ lock --idle"
enabled = true

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = false

# Locking before sleep is the distro's lock-watch service (`@DISTRO_ID@ lock`),
# so the screensaver plays behind the lock after waking too.
[lockscreen]
lock_before_suspend = false

[idle.behavior.screen-off]
timeout = 660
action = "screen_off"
enabled = true

# Carry the theme's colours to other apps. Each template only touches apps
# whose config file exists (starter configs ship for every terminal listed).
[theme.templates]
enable_builtin_templates = true
builtin_ids = ["ghostty", "alacritty", "kitty", "foot", "wezterm", "gtk3", "gtk4", "qt", "hyprland", "btop", "starship"]

# Distro plugins ship read-only in /usr/share; Noctalia loads them from there.
[plugins]
enabled = ["@DISTRO_ID@/crashes", "@DISTRO_ID@/agents", "@DISTRO_ID@/utilities"]
# No background checks of online plugin catalogs; install or update plugins
# from Settings when you want to.
auto_update = "none"

[[plugins.source]]
name = "@DISTRO_ID@"
kind = "path"
location = "/usr/share/@DISTRO_ID@/default/noctalia-plugins"
enabled = true

# The bar: workspaces on the left; in the centre the clock and weather with a
# group of one-click utilities just before them; status icons on the right,
# each opening its own panel. The crescent on the far left opens the system
# menu (right-click: apps).
[widget.menu]
type = "custom_button"
custom_image = "/usr/share/icons/hicolor/symbolic/apps/@DISTRO_ID@-logo-symbolic.svg"
custom_image_colorize = true
tooltip = "Menu (SUPER+ALT+Space)"

[widget.menu.actions]
left = "exec @DISTRO_ID@ menu"
right = "panel-toggle launcher"

# Workspaces: numbers, the one you're on drawn as its moon phase, a gold dot
# where a window asks for attention (decision record 0037). Noctalia's own
# pills stay available: `@DISTRO_ID@ workspaces style noctalia`.
[widget.workspaces]
type = "@DISTRO_ID@/utilities:workspaces"

[widget.workspaces-noctalia]
type = "workspaces"
style = "regular"
show_labels = true
labels_only_when_occupied = false

[widget.stay-awake]
type = "caffeine"

[widget.gravity]
type = "@DISTRO_ID@/utilities:gravity"

[widget.silence]
type = "@DISTRO_ID@/utilities:silence"

[widget.reminders]
type = "@DISTRO_ID@/utilities:reminders"

[widget.recorder]
type = "@DISTRO_ID@/utilities:recorder"

[widget.dictate]
type = "@DISTRO_ID@/utilities:dictate"

[widget.clock]
format = "{:%a %H:%M}"
tooltip_format = "{:%A, %B %d, %Y}"

[widget.weather]
show_condition = false

[widget.media]
hide_when_no_media = true
max_length = 180

[widget.tray]
drawer = true

[widget.notifications]
hide_when_no_unread = true

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.brightness]
show_label = false

# The active keyboard layout, only when there is more than one; click to switch.
[widget.keyboard_layout]
hide_when_single_layout = true

[widget.battery]
show_label = false
hide_when_full = false

# Low-battery warning at 20%; `@DISTRO_ID@ power` adds persistent alerts at 10%
# and 5% (settings power.battery_critical and power.battery_final).
[battery]
warning_threshold = 20

# Each hides itself when it has nothing to show.
[widget.crashes]
type = "@DISTRO_ID@/crashes:indicator"

[widget.ai-usage]
type = "@DISTRO_ID@/agents:usage"

[bar.default]
start  = ["menu", "workspaces"]
center = ["stay-awake", "nightlight", "gravity", "silence", "reminders", "recorder", "dictate", "clock", "weather"]
end    = ["media", "tray", "ai-usage", "crashes", "notifications", "keyboard_layout", "network", "bluetooth", "volume", "brightness", "battery", "session"]

# Location and weather are off until you turn them on (they send your city to
# Noctalia's geocoder and Open-Meteo): first-login setup asks, or run
# `@DISTRO_ID@ privacy weather on`. Never locate by IP address.
[location]
auto_locate = false

[weather]
enabled = false
unit = "metric"
