id = "@DISTRO_ID@/utilities"
name = "Utilities"
version = "0.1.0"
plugin_api = 32
author = "@DISTRO_ID@"
license = "GPL-3.0-or-later"
icon = "tool"
description = "The bar's segments (menu button, workspaces, media, clock, moon, weather, stats) and toggles (stay awake, night light, Low Gravity, silence, reminders, recording, dictation), the menu (SUPER+Space), now playing and the volume display."
tags = ["system"]

# The bar's own segments (Frosted Terminal, decision record 0043), drawn
# flat, full height, between hairlines (seg.luau).
[[widget]]
id = "menu-button"
entry = "menu-button.luau"

# Workspaces: two-digit numbers, the active one tinted with its moon phase, a
# gold dot for attention (`@DISTRO_ID@ workspaces --help`).
[[widget]]
id = "workspaces"
entry = "workspaces.luau"

[[widget]]
id = "media"
entry = "media.luau"

# The centre lane's anchor: always at the exact middle of the bar.
[[widget]]
id = "clock"
entry = "clock.luau"

# Opt-in (`@DISTRO_ID@ bar moon on`).
[[widget]]
id = "moon"
entry = "moon.luau"

# Opt-in (`@DISTRO_ID@ privacy weather on`): Noctalia's weather reading as a
# segment, with the moon in it when that is on too.
[[widget]]
id = "weather"
entry = "weather.luau"

# CPU, memory, network, battery: an icon with a popover, or inline
# (`@DISTRO_ID@ bar stats`).
[[widget]]
id = "stats"
entry = "stats.luau"

[[widget]]
id = "sound"
entry = "sound.luau"

[[widget]]
id = "network"
entry = "network.luau"

[[widget]]
id = "bell"
entry = "bell.luau"

[[widget]]
id = "divider"
entry = "divider.luau"

# The toggles (decision record 0042). "toggles" is their anchor: the others
# show only while on, or while the anchor is hovered (toggle.luau).
[[widget]]
id = "toggles"
entry = "toggles.luau"

# Stay awake and night light (`@DISTRO_ID@ awake`, `@DISTRO_ID@ nightlight`), in
# place of Noctalia's own widgets, which can't hide when off.
[[widget]]
id = "stay-awake"
entry = "stay-awake.luau"

[[widget]]
id = "nightlight"
entry = "nightlight.luau"

# Low Gravity: float this workspace's windows (`@DISTRO_ID@ gravity --help`).
[[widget]]
id = "gravity"
entry = "gravity.luau"

[[widget]]
id = "silence"
entry = "silence.luau"

[[widget]]
id = "recorder"
entry = "recorder.luau"

[[widget]]
id = "dictate"
entry = "dictate.luau"

[[widget]]
id = "reminders"
entry = "reminders.luau"

# More quick settings for the bar (quick-items.luau; `@DISTRO_ID@ quick` picks
# which show in the bar and which in the quick settings popover).
[[widget]]
id = "quick-wifi"
entry = "quick-wifi.luau"

[[widget]]
id = "quick-bluetooth"
entry = "quick-bluetooth.luau"

[[widget]]
id = "quick-power"
entry = "quick-power.luau"

[[widget]]
id = "quick-dark"
entry = "quick-dark.luau"

[[widget]]
id = "quick-mic"
entry = "quick-mic.luau"

# The same two as quick-settings tiles, in place of the built-in ones.
[[shortcut]]
id = "stay-awake-shortcut"
entry = "stay-awake-shortcut.luau"

[[shortcut]]
id = "nightlight-shortcut"
entry = "nightlight-shortcut.luau"

# The network popover, under the network segment.
[[panel]]
id = "network-panel"
entry = "network-panel.luau"
width = 380
height = 560
placement = "floating"
open_near_click = true

# The notification popover, under the bell.
[[panel]]
id = "notify-panel"
entry = "notify-panel.luau"
width = 400
height = 560
placement = "floating"
open_near_click = true

# The sound popover, under the sound segment: output and microphone.
[[panel]]
id = "sound-panel"
entry = "sound-panel.luau"
width = 380
height = 400
placement = "floating"
open_near_click = true

# The weather popover, under the weather segment (pop.luau's look).
# Quick settings (SUPER+S): the quick settings chosen for the popover as tiles,
# volume and brightness, Edit to choose what shows here and in the bar.
[[panel]]
id = "quick-panel"
entry = "quick-panel.luau"
width = 400
height = 400
placement = "floating"
position = "top_right"

[[panel]]
id = "calendar-panel"
entry = "calendar-panel.luau"
width = 320
height = 352
placement = "floating"
open_near_click = true

[[panel]]
id = "weather-panel"
entry = "weather-panel.luau"
width = 360
height = 520
placement = "floating"
open_near_click = true

# The stats popover: one that closes on an outside click (icons mode), one
# that never takes the pointer or keyboard away, opened and closed by hovering
# (hover mode).
[[panel]]
id = "stats-panel"
entry = "stats-panel.luau"
width = 300
height = 172
placement = "floating"
open_near_click = true

[[panel]]
id = "stats-hover"
entry = "stats-panel.luau"
width = 300
height = 172
placement = "floating"
open_near_click = true
keyboard_focus = "none"
dismiss_on_outside_click = false

[[panel]]
id = "reminders-panel"
entry = "reminders-panel.luau"
width = 420
height = 460
placement = "attached"

# The menu (SUPER+Space; decision record 0043): one keyboard list drawn by the
# plugin. Its own surface, from the theme's tokens: decoration = false (a patch
# of the distro's Noctalia build) leaves the panel clear around it, so it grows
# with its list. The keys it handles itself; Escape always closes.
[[panel]]
id = "menu"
entry = "menu-panel.luau"
width = 560
height = 700
placement = "floating"
position = "top_center"
decoration = false
keyboard_focus = "exclusive"
capture_keys = ["Up", "Down", "Return", "BackSpace", "ctrl+r"]

# The theme picker (`@DISTRO_ID@ theme pick`, SUPER+SHIFT+Space): every theme
# as a picture, chosen with the arrow keys. Its own surface, like the menu.
[[panel]]
id = "themes"
entry = "theme-picker.luau"
width = 1180
height = 620
placement = "floating"
position = "center"
decoration = false
keyboard_focus = "exclusive"
capture_keys = ["Left", "Right", "Up", "Down", "Return"]

# Now playing, under the media segment (Frosted Terminal popovers, decision
# record 0043): drawn by the plugin like the menu, so it grows with up next.
# Space plays or pauses, Left and Right seek.
[[panel]]
id = "now-playing"
entry = "media-panel.luau"
width = 480
height = 460
placement = "floating"
open_near_click = true
decoration = false
keyboard_focus = "exclusive"
capture_keys = ["space", "Left", "Right"]

# The volume and brightness display: a pill at the bottom centre that stays
# up beside any open panel, never takes the keyboard, and closes itself
# (`@DISTRO_ID@ osd`).
[[panel]]
id = "osd"
entry = "osd.luau"
width = 256
height = 52
placement = "floating"
position = "bottom_center"
decoration = false
persistent = true
keyboard_focus = "none"
dismiss_on_outside_click = false
