id = "@DISTRO_ID@/utilities"
name = "Utilities"
version = "0.1.0"
plugin_api = 32
author = "@DISTRO_ID@"
license = "GPL-3.0-or-later"
icon = "tool"
description = "The bar's segments (menu button, workspaces, media, clock, moon, stats) and toggles (stay awake, night light, Low Gravity, silence, reminders, recording, dictation), and the system menu in the launcher."
tags = ["system"]

# The bar's own segments (Frosted Terminal, decision record 0043), drawn
# flat, full height, between hairlines (seg.luau).
[[widget]]
id = "menu-button"
entry = "menu-button.luau"

# Workspaces: two-digit numbers, the active one tinted with its moon phase, a
# gold dot for attention (`@DISTRO_ID@ workspaces --help`).
[[widget]]
id = "workspaces"
entry = "workspaces.luau"

[[widget]]
id = "media"
entry = "media.luau"

# The centre lane's anchor: always at the exact middle of the bar.
[[widget]]
id = "clock"
entry = "clock.luau"

# Opt-in (`@DISTRO_ID@ bar moon on`).
[[widget]]
id = "moon"
entry = "moon.luau"

# CPU, memory, network, battery: an icon with a popover, or inline
# (`@DISTRO_ID@ bar stats`).
[[widget]]
id = "stats"
entry = "stats.luau"

[[widget]]
id = "divider"
entry = "divider.luau"

# The toggles (decision record 0042). "toggles" is their anchor: the others
# show only while on, or while the anchor is hovered (toggle.luau).
[[widget]]
id = "toggles"
entry = "toggles.luau"

# Stay awake and night light (`@DISTRO_ID@ awake`, `@DISTRO_ID@ nightlight`), in
# place of Noctalia's own widgets, which can't hide when off.
[[widget]]
id = "stay-awake"
entry = "stay-awake.luau"

[[widget]]
id = "nightlight"
entry = "nightlight.luau"

# Low Gravity: float this workspace's windows (`@DISTRO_ID@ gravity --help`).
[[widget]]
id = "gravity"
entry = "gravity.luau"

[[widget]]
id = "silence"
entry = "silence.luau"

[[widget]]
id = "recorder"
entry = "recorder.luau"

[[widget]]
id = "dictate"
entry = "dictate.luau"

[[widget]]
id = "reminders"
entry = "reminders.luau"

# The same two as quick-settings tiles, in place of the built-in ones.
[[shortcut]]
id = "stay-awake-shortcut"
entry = "stay-awake-shortcut.luau"

[[shortcut]]
id = "nightlight-shortcut"
entry = "nightlight-shortcut.luau"

# The stats popover: one that closes on an outside click (icons mode), one
# that never takes the pointer or keyboard away, opened and closed by hovering
# (hover mode).
[[panel]]
id = "stats-panel"
entry = "stats-panel.luau"
width = 300
height = 172
placement = "floating"
open_near_click = true

[[panel]]
id = "stats-hover"
entry = "stats-panel.luau"
width = 300
height = 172
placement = "floating"
open_near_click = true
keyboard_focus = "none"
dismiss_on_outside_click = false

[[panel]]
id = "reminders-panel"
entry = "reminders-panel.luau"
width = 420
height = 460
placement = "attached"

# The system menu and app search (SUPER+Space): /m in the launcher. Empty, it
# lists Apps and the menu's groups; typing searches apps and every menu item.
# Groups drill in and the launcher stays open (decision record 0042).
[[launcher_provider]]
id = "menu"
entry = "menu.luau"
prefix = "m"
glyph = "layout-grid"

# Keyboard shortcuts (SUPER+K): /keys in the launcher.
[[launcher_provider]]
id = "keys"
entry = "keys.luau"
prefix = "keys"
glyph = "keyboard"
