# Telemetry opt-outs for tools people commonly install.
# Read by the desktop session (environment.d) and login shells (profile.d).
DO_NOT_TRACK=1
# Claude Code: no usage telemetry or error reports (auto-updates stay on).
DISABLE_TELEMETRY=1
DISABLE_ERROR_REPORTING=1
DOTNET_CLI_TELEMETRY_OPTOUT=1
NEXT_TELEMETRY_DISABLED=1
GATSBY_TELEMETRY_DISABLED=1
ASTRO_TELEMETRY_DISABLED=1
NUXT_TELEMETRY_DISABLED=1
HOMEBREW_NO_ANALYTICS=1
SAM_CLI_TELEMETRY=0
AZURE_CORE_COLLECT_TELEMETRY=0
POWERSHELL_TELEMETRY_OPTOUT=1
VCPKG_DISABLE_METRICS=1
CHECKPOINT_DISABLE=1
STRIPE_CLI_TELEMETRY_OPTOUT=1
SCARF_ANALYTICS=false
HF_HUB_DISABLE_TELEMETRY=1
DENO_NO_UPDATE_CHECK=1
BUN_DISABLE_TELEMETRY=1
TURBO_TELEMETRY_DISABLED=1
NG_CLI_ANALYTICS=false
STORYBOOK_DISABLE_TELEMETRY=1
CLOUDSDK_CORE_DISABLE_USAGE_REPORTING=true
