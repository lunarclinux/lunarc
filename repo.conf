# Where installed systems get the distro's packages (layer 7).
#
# REPO_URL is what pacman.conf's Server line points at. It is our own domain,
# which Cloudflare redirects to the GitHub release below, so the hosting can
# move later without touching installed systems.
REPO_URL=https://pkgs.lunarclinux.com

# The GitHub repository tools/publish uploads to (OWNER/REPO); its release
# named "packages" holds the signed packages and database. Read after
# distro.conf, so $DISTRO_ID is set.
REPO_GITHUB=lunarclinux/$DISTRO_ID-packages

# A second Server line: the same release, straight from GitHub. pacman moves
# on to it when REPO_URL fails, as on networks whose filters block a new domain
# (a corporate DNS filter blocked ours in its first weeks, 2026-10).
REPO_FALLBACK=https://github.com/$REPO_GITHUB/releases/download/packages

# The security feed installs read (`$DISTRO_ID update security`): high and
# critical CVEs whose fix is in the repositories, written every six hours by
# .github/workflows/security.yml to this repository's release named "security".
ADVISORIES_URL=https://github.com/lunarclinux/$DISTRO_ID/releases/download/security/advisories.json
